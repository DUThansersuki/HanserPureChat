version: 1
prompt_rules:
  - 普通聊天正文使用空格或换行代替常规中文标点
  - 作品名 URL 代码 数值格式 明确引用和资料原文不做破坏性改写
  - 不使用客服式收尾
normalizer:
  enabled: true
  replace_with_space:
    - "，"
    - "。"
    - "！"
    - "？"
    - "；"
    - "："
    - "……"
    - "…"
  preserve_patterns:
    - "```[\\s\\S]*?```"
    - "`[^`\\n]+`"
    - "https?://[^\\s，。！？；：]+"
    - "《[^》\\n]+》"
    - "“[^”\\n]+”"
    - "「[^」\\n]+」"
    - "\\[[^\\]\\n]+\\]\\([^\\)\\n]+\\)"
