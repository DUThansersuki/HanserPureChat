<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hanser Chat Voice 设置</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #2f2b27; background: #faf8f5; }
      main { max-width: 680px; margin: 0 auto; padding: 32px 32px 24px; }
      h1 { margin: 0 0 8px; font-size: 26px; font-weight: 650; }
      p { margin: 0 0 22px; color: #70675f; font-size: 14px; line-height: 1.6; }
      label { display: block; margin: 0 0 16px; font-size: 13px; font-weight: 600; }
      input { display: block; width: 100%; margin-top: 7px; border: 1px solid #c7b9a9; border-radius: 8px; padding: 10px 12px; color: #2f2b27; background: #fff; font: inherit; outline: none; }
      input:focus-visible { border-color: #a94d1d; outline: 2px solid #a94d1d; outline-offset: 2px; }
      small { display: block; margin-top: 6px; color: #70675f; font-size: 12px; font-weight: 400; }
      .actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; }
      #message { min-height: 20px; color: #aa352c; font-size: 12px; }
      button { border: 0; border-radius: 8px; padding: 10px 18px; color: white; background: #b65320; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #a94d1d; }
      button:focus-visible { outline: 2px solid #a94d1d; outline-offset: 3px; }
      button:disabled { cursor: wait; opacity: .55; }
      .privacy { margin: 20px 0 0; border-top: 1px solid #e4ded6; padding-top: 16px; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>连接回答模型</h1>
      <p>填写回答模型的连接信息，保存后即可开始聊天。</p>
      <form id="settings-form">
        <label>
          Base URL
          <input id="base-url" type="url" autocomplete="url" required />
          <small>本地 Ollama 或外部模型服务地址。</small>
        </label>
        <label>
          模型名
          <input id="model" type="text" autocomplete="off" required />
          <small>填写服务提供的模型名称。</small>
        </label>
        <label>
          API Key
          <input id="api-key" type="password" autocomplete="off" />
          <small id="key-hint">本地 Ollama 可留空。</small>
        </label>
        <div class="actions">
          <span id="message" role="status"></span>
          <button id="save" type="submit">保存并启动</button>
        </div>
      </form>
      <p class="privacy">聊天记录、记忆与语音服务在本机运行。选择外部模型时，回答请求会发往该模型服务。API Key 使用 Windows 安全存储加密。</p>
    </main>
    <script>
      const form = document.getElementById("settings-form");
      const baseUrl = document.getElementById("base-url");
      const model = document.getElementById("model");
      const apiKey = document.getElementById("api-key");
      const keyHint = document.getElementById("key-hint");
      const message = document.getElementById("message");
      const save = document.getElementById("save");

      window.hanserDesktop.getSetupState().then((state) => {
        baseUrl.value = state.baseUrl;
        model.value = state.model;
        if (state.hasApiKey) {
          keyHint.textContent = "API Key 已保存；留空表示保持不变。";
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        save.disabled = true;
        message.textContent = "正在保存……";
        const result = await window.hanserDesktop.saveSettings({
          apiKey: apiKey.value,
          baseUrl: baseUrl.value,
          model: model.value,
        });
        if (!result.ok) {
          message.textContent = result.message;
          save.disabled = false;
        }
      });
    </script>
  </body>
</html>
